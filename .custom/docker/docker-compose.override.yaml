# [CUSTOM] 二开服务配置覆盖
# 功能: Sandbox 增强 + API 原生文档提取
# 文档: .custom/docs/features/native-document-extractors.md
#
# 使用方式:
#   docker compose -f docker-compose.middleware.yaml \
#       -f ../.custom/docker/docker-compose.override.yaml \
#       --env-file middleware.env up -d

services:
  # [CUSTOM] API 服务 - 支持原生文档提取 (DOC/PPT)
  # 需要先构建自定义镜像: make -f Makefile.custom api-build
  api:
    image: ${API_IMAGE:-langgenius/dify-api:0.15.3}

  # [CUSTOM] Worker 服务 - 与 API 使用相同镜像
  worker:
    image: ${API_IMAGE:-langgenius/dify-api:0.15.3}

  # [CUSTOM] Sandbox 增强
  sandbox:
    # 使用自定义镜像（包含系统依赖 + 烘焙的配置和入口点）
    image: ${SANDBOX_IMAGE:-langgenius/dify-sandbox:0.2.12}

    # [CUSTOM] 开发环境安全配置
    # 开发/测试: seccomp:unconfined 快速迭代
    # 生产: 移除此项，依赖镜像内 config.yaml 中的 syscall 白名单
    security_opt:
      - seccomp:unconfined

    # 扩展环境变量
    environment:
      WORKER_TIMEOUT: ${SANDBOX_WORKER_TIMEOUT:-15}
      ENABLE_NETWORK: ${SANDBOX_ENABLE_NETWORK:-true}

    # [CUSTOM] 文件挂载 (仅运行时需要的卷)
    volumes:
      # 官方目录
      - ./volumes/sandbox/dependencies:/dependencies
      - ./volumes/sandbox/conf:/conf
      # 文件输出目录
      - ./volumes/sandbox/files:/sandbox_files
