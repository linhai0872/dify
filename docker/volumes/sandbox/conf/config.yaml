# 与 .custom/docker/sandbox/conf/config.base.yaml 保持同步（提交前如有改动请两边对齐）。
# 自定义 Sandbox 镜像启动时由 init-config.sh 按容器架构追加 arch/syscalls.aarch64.yaml 或 arch/syscalls.x86_64.yaml（Mac ARM / Linux x86_64 等）。

# [CUSTOM] Dify Sandbox 基础配置
# 功能: 依赖管理 + 文件输入输出
# 注意: syscall 白名单由 init-config.sh 根据架构自动追加
# 文档: .custom/docs/development/README.md

app:
  port: 8194
  debug: True
  key: dify-sandbox

max_workers: 4
max_requests: 50
worker_timeout: 15  # [CUSTOM] 扩展为 15s（支持复杂操作）

# 与上游 1.13.3 默认一致（见官方 Sandbox 镜像）；自定义镜像可覆盖
python_path: /opt/python/bin/python3
nodejs_path: /usr/local/bin/node
python_lib_path:
  - /opt/python/lib
  - /opt/python/lib/python3.10
  - /usr/local/lib/python3.10
  - /usr/lib/python3.10
  - /usr/lib/python3
  - /usr/lib/x86_64-linux-gnu      # x86_64 支持
  - /lib/x86_64-linux-gnu          # x86_64 支持
  - /usr/lib/aarch64-linux-gnu     # [CUSTOM] ARM64 支持
  - /lib/aarch64-linux-gnu         # [CUSTOM] ARM64 支持
  - /etc/ld.so.cache               # [CUSTOM] 动态库缓存
  - /etc/ssl/certs/ca-certificates.crt
  - /etc/nsswitch.conf
  - /etc/hosts
  - /etc/resolv.conf

enable_network: True # please make sure there is no network risk in your environment

proxy:
  socks5: ''
  http: ''
  https: ''

# allowed_syscalls 由 init-config.sh 根据架构自动追加
# 参见: arch/syscalls.aarch64.yaml 或 arch/syscalls.x86_64.yaml
